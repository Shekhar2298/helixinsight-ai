apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: helixinsight
spec:
  replicas: 2
  selector:
    matchLabels: {app: orchestrator}
  template:
    metadata:
      labels: {app: orchestrator}
    spec:
      containers:
        - name: orchestrator
          image: ghcr.io/OWNER/helixinsight-orchestrator:latest
          env:
            - name: BIO_API_URL
              value: http://bio-api:8000
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: helixinsight
spec:
  selector: {app: orchestrator}
  ports: [{port: 80, targetPort: 8080}]
