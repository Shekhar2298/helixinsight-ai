apiVersion: apps/v1
kind: Deployment
metadata:
  name: bio-api
  namespace: helixinsight
spec:
  replicas: 2
  selector:
    matchLabels: {app: bio-api}
  template:
    metadata:
      labels: {app: bio-api}
    spec:
      containers:
        - name: bio-api
          image: ghcr.io/OWNER/helixinsight-bio-api:latest
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "2", memory: "2Gi"}
---
apiVersion: v1
kind: Service
metadata:
  name: bio-api
  namespace: helixinsight
spec:
  selector: {app: bio-api}
  ports: [{port: 8000, targetPort: 8000}]
